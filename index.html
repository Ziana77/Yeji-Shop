<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yeji Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand-wrap">
          <div class="brand-mark">♥</div>
          <div class="brand">Yeji Shop</div>
        </div>
        <nav>
          <a href="#products">新品</a>
          <a href="#featured">推薦</a>
          <a href="#cart">購物車</a>
        </nav>
        <button class="cart-button" id="cartToggle">
          購物車 <span id="cartCount">0</span>
        </button>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container hero-inner">
          <div class="hero-copy">
            <span class="eyebrow">黑色系愛心風</span>
            <h1>有品味，才有自信</h1>
            <p>
              Yeji Shop 精選彩妝、配件、服飾與特色餅乾，將日常穿搭與美妝風格
              融成一種慵懶但有型的生活方式。
            </p>
            <div class="hero-actions">
              <a href="#products" class="primary-btn">開始購物</a>
              <a href="#featured" class="secondary-btn">查看推薦</a>
            </div>
          </div>
          <div class="hero-card leopard-panel">
            <div class="badge">熱銷排行</div>
            <div class="mini-product">
              <div class="mini-image mini-one"></div>
              <div>
                <h3>黑色愛心唇膏</h3>
                <p>NT$ 990</p>
              </div>
            </div>
            <div class="mini-product">
              <div class="mini-image mini-two"></div>
              <div>
                <h3>豹紋小包</h3>
                <p>NT$ 1,280</p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="featured" id="featured">
        <div class="container">
          <div class="section-header">
            <p>熱銷推薦</p>
            <h2>本週精選</h2>
          </div>
          <div class="featured-grid" id="featuredGrid"></div>
        </div>
      </section>

      <section class="products" id="products">
        <div class="container">
          <div class="section-header split">
            <div>
              <p>商品列表</p>
              <h2>探索好物</h2>
            </div>
            <div class="filter-group" id="filterGroup">
              <button class="filter active" data-category="all">全部</button>
              <button class="filter" data-category="彩妝">彩妝</button>
              <button class="filter" data-category="服飾">服飾</button>
              <button class="filter" data-category="配件">配件</button>
              <button class="filter" data-category="零食">零食</button>
            </div>
          </div>
          <div class="product-grid" id="productGrid"></div>
        </div>
      </section>
    </main>

    <aside class="cart-panel" id="cart">
      <div class="cart-header">
        <h3>購物車</h3>
        <button id="closeCart">關閉</button>
      </div>
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-summary">
        <div class="row">
          <span>小計</span>
          <strong id="subtotal">NT$ 0</strong>
        </div>
        <div class="row">
          <span>運費</span>
          <strong id="shipping">NT$ 0</strong>
        </div>
        <div class="row total-row">
          <span>總計</span>
          <strong id="total">NT$ 0</strong>
        </div>
        <button class="checkout-btn" id="checkoutBtn">結帳</button>
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <script src="script.js"></script>
  </body>
</html>
